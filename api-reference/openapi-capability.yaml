info:
  description: |-
    CapabilityService 独立子能力服务
     提供文件上传、图像质检、材料分类、材料抽取等独立能力，不依赖案件流程。
     通过 batch_id 和 material_id 串联各能力调用。

     ## 典型调用流程
     1. 上传文件 → UploadFiles，获得 batch_id 和 material_id 列表
     2. (可选)图像质检 → CheckImageQuality，可独立调用，也可用上传返回的 material_id
     3. (可选)材料分类 → ClassifyMaterial，可独立调用，也可用上传返回的 material_id
     4. 材料抽取 → ExtractMaterial，传入 material_id 列表，返回每个材料的状态和结果
     5. 轮询 → 重复调用 ExtractMaterial 直到所有材料完成，或等待 callback_url 回调
     注: 质检和分类可独立调用，不依赖抽取流程；抽取接口的 material_ids 必须来自上传接口。
     注: ExtractMaterial 幂等，已完成的材料不会重新抽取，失败的材料会自动重试。

     ## 错误响应
     所有接口错误均返回 HTTP 非 200 状态码，body 格式: {"code": 400, "msg": "错误描述"}
     常见错误码:
       400 — 参数校验失败(缺少必填字段、文件数超限等)
       403 — 认证失败(x-ti-app-id 或 x-ti-secret-code 缺失/无效)
       404 — 资源不存在(material_id / batch_id 无效)
       500 — 内部处理异常

     错误响应示例:
       {"code": 404, "msg": "material not found"}
       {"code": 404, "msg": "batch not found"}
       {"code": 400, "msg": "material_ids or batch_id is required"}
       {"code": 400, "msg": "material does not belong to the specified batch"}
       {"code": 400, "msg": "files or file_urls is required"}
       {"code": 400, "msg": "所有材料必须属于同一批次"}
       {"code": 403, "msg": "x-api-key 或 x-ti-app-id/x-ti-secret-code 不能为空"}
  title: CapabilityService API
  version: 0.0.1
openapi: 3.0.3
paths:
  /doc-agent/api/v1/capability/division/lookup:
    post:
      description: |-
        行政区划查询
        根据名称模糊匹配省/市/县三级行政区划，返回的 preferred_code 可作为
        SearchSocialInsurance 接口的 zone_code 参数使用。
      operationId: CapabilityService_LookupDivision
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: 成都
            schema:
              $ref: '#/components/schemas/capability.v1.CapabilityLookupDivisionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  divisions:
                  - city_code: "510100"
                    city_name: 成都市
                    code: "510100"
                    name: 成都市
                    preferred_code: "510100"
                    province_code: "510000"
                    province_name: 四川省
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityLookupDivisionResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/field-config/query:
    post:
      description: |-
        查询字段配置。返回所有分类及其所有字段的最终启用状态（系统默认 + 调用方覆盖合并）。

        - classification_names 非空时：仅返回指定分类的字段配置
        - classification_names 为空时：返回所有分类及其所有字段的配置

        每个分类会列出其全部字段（包括普通字段和表格列字段），enabled 为合并后的最终状态。
      operationId: CapabilityService_QueryFieldConfig
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              查询所有分类:
                value: {}
              查询指定分类:
                value:
                  classification_names:
                  - 医疗门诊收费票据（电子）
            schema:
              $ref: '#/components/schemas/capability.v1.QueryFieldConfigRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  classifications:
                  - classification_name: 医疗门诊收费票据（电子）
                    fields:
                    - enabled: true
                      field_name: 单据标题名称
                    - enabled: true
                      field_name: 票据代码
                    - enabled: true
                      field_name: 票据号码
                    - enabled: false
                      field_name: 开票日期
                    - enabled: true
                      field_name: 发票金额合计
                    - enabled: true
                      field_name: 收款单位
                    - enabled: true
                      field_name: 交款人
                  - classification_name: 住院费用明细清单
                    fields:
                    - enabled: true
                      field_name: 姓名
                    - enabled: true
                      field_name: 住院号
                    - enabled: false
                      field_name: 住院天数
                    - enabled: true
                      field_name: 项目名称
                    - enabled: true
                      field_name: 金额
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.QueryFieldConfigResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/field-config/set:
    post:
      description: |-
        设置字段配置。批量设置一个或多个分类下抽取字段的启用/禁用状态。
        配置按调用方维度持久化存储，后续该调用方的抽取请求自动遵循。

        行为说明：
        - 只设置明确传入的字段，未提及的字段保持现有配置不变
        - 不存在的分类名或字段名静默忽略（不报错）
        - 幂等：重复调用相同请求结果一致
      operationId: CapabilityService_SetFieldConfig
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              classifications:
              - classification_name: 医疗门诊收费票据（电子）
                fields:
                - enabled: true
                  field_name: 票据代码
                - enabled: false
                  field_name: 开票日期
              - classification_name: 住院费用明细清单
                fields:
                - enabled: true
                  field_name: 姓名
                - enabled: false
                  field_name: 住院天数
            schema:
              $ref: '#/components/schemas/capability.v1.SetFieldConfigRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data: {}
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.SetFieldConfigResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/file/upload:
    post:
      description: '文件上传。支持类型: jpg, jpeg, png, bmp, tiff, pdf。单文件上限: 50MB，单次上传上限: 20 个文件。'
      operationId: CapabilityService_UploadFiles
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            example:
              batch_id: 661be601-65c7-4025-af0f-20d357dfb090
              files: '@门诊收费票据01.png'
            schema:
              properties:
                batch_id:
                  description: 调用方自定义批次ID(UUID格式，不传则系统生成)
                  example: 661be601-65c7-4025-af0f-20d357dfb090
                  type: string
                file_urls:
                  description: URL 上传(与 files 可混合使用)，JSON 数组格式
                  example: '["https://example.com/file1.pdf","https://example.com/file2.jpg"]'
                  type: string
                files:
                  description: 文件二进制上传(支持多文件)
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  batch_id: 661be601-65c7-4025-af0f-20d357dfb090
                  materials:
                  - file_name: 门诊收费票据01.png
                    file_size: "520464"
