    common.Table:
      description: |-
        Table（表格）相关结构：
        - Table.items 对应你的 JSON 中 "items": [ [ {...}, {...} ], [ ... ] ]
        - Row 表示一行，Row.cells 表示该行的多个单元格（每个单元格复用 Field
      properties:
        items:
          description: 表格的行数组（每行是一个 Row）
          items:
            $ref: '#/components/schemas/common.Row'
          type: array
        table_name:
          description: 表名，例如 "Table1"
          type: string
        table_type:
          description: 表类型（字符串，和原 JSON 的 "type" 对应）
          type: string
      type: object
    common.VatInvoiceVerifyResult:
      description: 增值税发票验真结果
      properties:
        code:
          description: 验真返回码
          type: string
        data:
          description: 详细数据(原始 JSON)
          type: string
        invalid_mark:
          description: 作废标志
          type: string
        invoice_code:
          description: 发票代码
          type: string
        invoice_date:
          description: 开票日期
          type: string
        invoice_number:
          description: 发票号码
          type: string
        invoice_type:
          description: 发票类型
          type: string
        message:
          description: 返回信息
          type: string
        purchaser_taxpayer_number:
          description: 购方税号
          type: string
      type: object
    common.VerifyVatRet:
      properties:
        code:
          description: |-
            发票验真返回码说明

             001    成功，验证为真
             002    此发票今日查询次数已达上限(5次)，请次日查询
             005    请求不合法，请核对验真参数
             006    发票信息不一致，请核对发票信息
             009    查无此票，请核对发票信息
             104    已超过最大查验量
             105    查询发票不规范，请核对发票信息
             106    查验异常，国税局/发票查验地区升级维护，请稍后重试
             107    鉴权失败
             108    参数不为空
             109    参数长度不正确
             110    参数 invoice_code 的格式或取值范围错误
             111    参数 invoice_sum 的格式或取值范围错误
             112    参数 verify_code 的格式或取值范围错误
             113    参数 invoice_no 的格式或取值范围错误
             114    校验码不正确，应为后六位
             115    超过服务有效期限限制
             116    此发票今日查询次数已达上限(5次)，请次日查询
             1005   请核对验真参数是否符合发票规范
             1010   日期格式不正确(YYYYMMDD)
             1011   请求参数不完整
             1021   查验异常，国税局/发票查验地区升级维护，请稍后重试
             10014  日期当天不能查验
             10015  开票金额：不合法的格式
             10016  检验码：不能为空
             10017  超过五年的不能查验
             10018  检验码：不合法的长度
             10020  没有查验权限
          type: string
        fiscal_result:
          allOf:
          - $ref: '#/components/schemas/common.FiscalBillVerifyResult'
          description: 财政票据验真详情(医疗门诊/住院电子票据)
        message:
          description: 发票验真返回码说明
          type: string
        vat_result:
          allOf:
          - $ref: '#/components/schemas/common.VatInvoiceVerifyResult'
          description: 增值税发票验真详情
      type: object
info:
  description: |-
    CapabilityService 独立子能力服务
     提供文件上传、图像质检、材料分类、材料抽取等独立能力，不依赖案件流程。
     通过 batch_id 和 material_id 串联各能力调用。

     ## 典型调用流程
     1. 上传文件 → UploadFiles，获得 batch_id 和 material_id 列表
     2. (可选)图像质检 → CheckImageQuality，可独立调用，也可用上传返回的 material_id
     3. (可选)材料分类 → ClassifyMaterial，可独立调用，也可用上传返回的 material_id
     4. 材料抽取 → ExtractMaterial，传入 material_id 列表，返回每个材料的状态和结果
     5. 轮询 → 重复调用 ExtractMaterial 直到所有材料完成，或等待 callback_url 回调
     注: 质检和分类可独立调用，不依赖抽取流程；抽取接口的 material_ids 必须来自上传接口。
     注: ExtractMaterial 幂等，已完成的材料不会重新抽取，失败的材料会自动重试。

     ## 错误响应
     所有接口错误均返回 HTTP 非 200 状态码，body 格式: {"code": 400, "msg": "错误描述"}
     常见错误码:
       400 — 参数校验失败(缺少必填字段、文件数超限等)
       403 — 认证失败(x-ti-app-id 或 x-ti-secret-code 缺失/无效)
       404 — 资源不存在(material_id / batch_id 无效)
       500 — 内部处理异常

     错误响应示例:
       {"code": 404, "msg": "material not found"}
       {"code": 404, "msg": "batch not found"}
       {"code": 400, "msg": "material_ids or batch_id is required"}
       {"code": 400, "msg": "material does not belong to the specified batch"}
       {"code": 400, "msg": "files or file_urls is required"}
       {"code": 400, "msg": "所有材料必须属于同一批次"}
       {"code": 403, "msg": "x-api-key 或 x-ti-app-id/x-ti-secret-code 不能为空"}
  title: CapabilityService API
  version: 0.0.1
openapi: 3.0.3
paths:
  /doc-agent/api/v1/capability/division/lookup:
    post:
      description: |-
        行政区划查询
         根据名称模糊匹配省/市/县三级行政区划，返回的 preferred_code 可作为
         SearchSocialInsurance 接口的 zone_code 参数使用。
      operationId: CapabilityService_LookupDivision
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              name: 成都
            schema:
              $ref: '#/components/schemas/capability.v1.CapabilityLookupDivisionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  divisions:
                  - city_code: "510100"
                    city_name: 成都市
                    code: "510100"
                    name: 成都市
                    preferred_code: "510100"
                    province_code: "510000"
                    province_name: 四川省
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityLookupDivisionResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/file/upload:
    post:
      description: |-
        文件上传
         支持类型: jpg, jpeg, png, bmp, tiff, pdf
         单文件上限: 50MB，单次上传上限: 20 个文件
      operationId: CapabilityService_UploadFiles
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                batch_id:
                  description: 调用方自定义批次ID(UUID格式，不传则系统生成)
                  type: string
                file_urls:
                  description: URL 上传(与 files 可混合使用)
                  items:
                    type: string
                  type: array
                files:
                  items:
                    format: binary
                    type: string
                  type: array
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  batch_id: 661be601-65c7-4025-af0f-20d357dfb090
                  materials:
                  - file_name: 门诊收费票据01.png
                    file_size: "520464"
                    file_type: image/png
                    material_id: 8ffe03ce-4714-4b50-8daf-afee06002cc3
                  - file_name: 住院费用明细.jpg
                    file_size: "1814199"
                    file_type: image/jpeg
                    material_id: 27734e23-3482-42a3-98d7-1bdb369118bc
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityUploadResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/icd/search:
    post:
      description: |-
        ICD 疾病编码查询
         按疾病名称或编码搜索 ICD-10 疾病分类信息
      operationId: CapabilityService_SearchICD
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              disease_str: S52.400
              page_num: 1
              page_size: 10
            schema:
              $ref: '#/components/schemas/capability.v1.CapabilityICDRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  list:
                  - category_name: ICD-10疾病编码
                    category_uuid: be966ca476acbba3623214e560cd2e6b
                    detail_uuid: 926d1709cb6f0d4a32a7b96526f6d136
                    disease_code: S52.400
                    disease_name: 尺骨和桡骨骨干均骨折
                    id: 40749
                    is_show: true
                    parent_uuid: a6f60a6458e81f5f8da6ca1507bbccd5
                  pagination:
                    page: 1
                    page_size: 10
                    sum: 1
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityICDResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/image-quality:
    post:
      description: |-
        图像质量检测
         检测项: 模糊(blurry)、不完整(un_integrity)、复印件(photocopy)、翻拍(screen_remark)、光斑(light_spot)、扫描件(scan)

         支持两种输入方式(互斥)：
           方式一：传 material_id 或 batch_id 指定已上传的材料
           方式二：直接上传文件(multipart/form-data 或 file_urls)
           同时传文件和 material_id/batch_id 会返回 400 错误

         质检模型参数通过 query string 传递，如 ?blurry_threshold=0.3&un_integrity_threshold=0.7
         参数与上次质检不一致时会重新调用质检模型。
      operationId: CapabilityService_CheckImageQuality
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                batch_id:
                  description: 批次 ID(处理批次下所有材料)
                  type: string
                blurry_threshold:
                  description: 模糊判断阈值(0.1~0.9，默认 0.5)
                  format: float
                  type: number
                detection_scope:
                  description: |-
                    ---- 质检模型参数(query string，可选) ----
                     检测范围控制：0 整图检测, 1 每个主体单独检测(默认 0)
                  format: int32
                  type: integer
                file_urls:
                  description: URL 上传(与 material_id/batch_id 互斥)
                  items:
                    type: string
                  type: array
                files:
                  items:
                    format: binary
                    type: string
                  type: array
                light_spot_level:
                  description: 光斑检测严格程度：0 更严格, 1 更宽松(默认 0)
                  format: int32
                  type: integer
                light_spot_threshold:
                  description: 光斑判断阈值(0.1~0.9，默认 0.5)
                  format: float
                  type: number
                material_id:
                  description: |-
                    ---- 方式一：指定已上传材料 ----
                     已上传材料的 ID(处理单个材料)
                  type: string
                photocopy_threshold:
                  description: 复印件判断阈值(0.1~0.9，默认 0.5)
                  format: float
                  type: number
                scan_threshold:
                  description: 扫描件判断阈值(0.1~0.9，默认 0.5)
                  format: float
                  type: number
                screen_remark_threshold:
                  description: 翻拍判断阈值(0.1~0.9，默认 0.5)
                  format: float
