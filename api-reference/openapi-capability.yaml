                  - file_name: 住院费用明细.jpg
                    file_size: "1814199"
                    file_type: image/jpeg
                    material_id: 27734e23-3482-42a3-98d7-1bdb369118bc
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityUploadResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
