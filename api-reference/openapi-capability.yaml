  /doc-agent/api/v1/capability/material/classify:
    post:
      description: |-
        材料分类
         默认分类以医疗票据和保险常用文件为主

         支持两种输入方式（互斥）：
           方式一：传 material_id 或 batch_id 指定已上传的材料
           方式二：直接上传文件（multipart/form-data 或 file_urls）
           同时传文件和 material_id/batch_id 会返回 400 错误
      operationId: CapabilityService_ClassifyMaterial
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                batch_id:
                  description: 批次 ID（处理批次下所有材料）
                  type: string
                file_urls:
                  description: URL 上传（与 material_id/batch_id 互斥）
                  items:
                    type: string
                  type: array
                files:
                  items:
                    format: binary
                    type: string
                  type: array
                material_id:
                  description: |-
                    已上传材料的 ID（处理单个材料）
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                batch_id 批量:
                  value:
                    code: 200
                    data:
                      materials:
                      - category: 费用与结算
                        material_id: 8088ecab-5d7f-4903-9c0c-483b583fc054
                        material_type: 住院费用明细清单
                      - category: 费用与结算
                        material_id: fcdf499c-1a20-4da2-9e4a-9227b9fc4ed7
                        material_type: 住院费用明细清单
                    message: OK
                单材料:
                  value:
                    code: 200
                    data:
                      materials:
                      - category: 费用与结算
                        material_id: 7e9596a5-b521-4a93-adf4-05e8309ecad3
                        material_type: 住院费用明细清单
                    message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityClassifyResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/material/extract:
    post:
      description: |-
        材料抽取（幂等）
         传入 material_id 列表，按需创建抽取任务：
           - 未处理的材料：创建抽取任务，返回 PENDING 状态
           - 处理中的材料：返回当前状态（CLASSIFYING/EXTRACTING）
           - 已完成的材料：直接返回结果，不重新抽取
           - 失败的材料：重新创建抽取任务
         支持重复调用直到所有材料 status=COMPLETED，或等待 callback_url 回调
      operationId: CapabilityService_ExtractMaterial
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
