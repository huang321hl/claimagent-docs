  /doc-agent/api/v1/capability/invoice/verify:
    post:
      description: |-
        发票验真
         直接调用底层验真 API，同步返回结果。支持两种发票类型：
           - fiscal: 财政电子票据(医疗门诊/住院收费票据等)
           - vat: 增值税发票
      operationId: CapabilityService_VerifyInvoice
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              增值税发票:
                value:
                  type: vat
                  vat:
                    invoice_code: "033002100311"
                    invoice_date: "20230901"
                    invoice_no: "48400000"
                    invoice_sum: "800.00"
                    verify_code: d3e4f5
              财政票据:
                value:
                  fiscal:
                    bill_amount: "500.00"
                    bill_code: "31060125"
                    bill_date: "20250801"
                    bill_no: "0290484000"
                    check_code: a0b1c2
                  type: fiscal
            schema:
              $ref: '#/components/schemas/capability.v1.CapabilityVerifyInvoiceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                财政票据 — 查验失败:
                  value:
                    code: 200
                    data:
                      fiscal_result:
                        code: 1009
                        message: 局端异常,请稍后重试
                    message: OK
                财政票据 — 查验成功:
                  value:
                    code: 200
                    data:
                      fiscal_result:
                        bill_code: "31060125"
                        bill_date: "20250801"
                        bill_name: 上海市医疗门诊收费票据(电子)
                        bill_no: "0290484000"
                        check_code: a0b1c2
                        code: 1000
                        file_type: ""
                        file_url: ""
                        item_details: '[{"je":"138.00","sl":"4.00","xmmc":"[乙10%]绞股蓝总甙片",...}]'
                        item_list: '[{"je":"37.00","xmbh":"PA0199","xmmc":"其他门急诊费",...}]'
                        message: 处理成功
                        payee: 上海市某医院
                        payer: 李某某
                        query_count: "2"
                        time: "2026-04-29 10:13:50"
                        total_amount: "500.00"
                    message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityVerifyInvoiceResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/material/classify:
    post:
      description: |-
        材料分类
         默认分类以医疗票据和保险常用文件为主

         支持两种输入方式(互斥)：
           方式一：传 material_id 或 batch_id 指定已上传的材料
           方式二：直接上传文件(multipart/form-data 或 file_urls)
           同时传文件和 material_id/batch_id 会返回 400 错误
      operationId: CapabilityService_ClassifyMaterial
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                batch_id:
                  description: 批次 ID(处理批次下所有材料)
                  type: string
                file_urls:
                  description: URL 上传(与 material_id/batch_id 互斥)
                  items:
                    type: string
                  type: array
                files:
                  items:
                    format: binary
                    type: string
                  type: array
                material_id:
                  description: |-
                    ---- 方式一：指定已上传材料 ----
                     已上传材料的 ID(处理单个材料)
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  materials:
                  - category: 费用与结算
                    material_id: 8ffe03ce-4714-4b50-8daf-afee06002cc3
                    material_type: 医疗门诊收费票据(电子)
                  - category: 费用与结算
                    material_id: 27734e23-3482-42a3-98d7-1bdb369118bc
                    material_type: 住院费用明细清单
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityClassifyResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
  /doc-agent/api/v1/capability/material/extract:
    post:
      description: |-
        材料抽取(幂等)
         传入 material_id 列表，按需创建抽取任务：
           - 未处理的材料：创建抽取任务，返回 PENDING 状态
           - 处理中的材料：返回当前状态(CLASSIFYING/EXTRACTING)
           - 已完成的材料：直接返回结果，不重新抽取
           - 失败的材料：重新创建抽取任务
         支持重复调用直到所有材料 status=COMPLETED，或等待 callback_url 回调
      operationId: CapabilityService_ExtractMaterial
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              指定分类:
                value:
                  category_hints:
                  - category: 费用与结算
                    material_id: 8ffe03ce-4714-4b50-8daf-afee06002cc3
                    material_type: 医疗门诊收费票据(电子)
                  material_ids:
                  - 8ffe03ce-4714-4b50-8daf-afee06002cc3
              指定材料:
                value:
                  material_ids:
                  - 8ffe03ce-4714-4b50-8daf-afee06002cc3
                  - 27734e23-3482-42a3-98d7-1bdb369118bc
              按批次:
                value:
                  batch_id: 661be601-65c7-4025-af0f-20d357dfb090
            schema:
              $ref: '#/components/schemas/capability.v1.CapabilityExtractRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                code: 200
                data:
                  materials:
                  - category: 费用与结算
                    extract_result:
                      document: null
                      extract_fields: []
                      tables: []
                    material_id: 8ffe03ce-4714-4b50-8daf-afee06002cc3
                    material_type: 医疗门诊收费票据(电子)
                    status: 1
                message: OK
              schema:
                properties:
                  code:
                    description: 业务状态码
                    example: 200
                    type: integer
                  data:
                    $ref: '#/components/schemas/capability.v1.CapabilityExtractResponse'
                  message:
                    description: 状态说明
                    example: OK
                    type: string
                type: object
          description: OK
      tags:
      - CapabilityService
