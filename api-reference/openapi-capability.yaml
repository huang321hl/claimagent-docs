components:
  schemas:
    capability.v1.CapabilityClassifyRequest:
      properties:
        batch_id:
          description: 批次 ID(处理批次下所有材料)
          example: 661be601-65c7-4025-af0f-20d357dfb090
          type: string
        file_urls:
          description: URL 上传(与 material_id/batch_id 互斥)
          example:
          - https://example.com/file1.pdf
          items:
            type: string
          type: array
        files:
          description: 文件二进制上传(支持多文件)
          items:
            $ref: '#/components/schemas/common.MultipartUpload'
          type: array
        material_id:
          description: 已上传材料的 ID(处理单个材料，与 files/file_urls 互斥)
          example: 8ffe03ce-4714-4b50-8daf-afee06002cc3
          type: string
      type: object
    capability.v1.CapabilityClassifyResponse:
      properties:
        materials:
          description: 各材料的分类结果
          items:
            $ref: '#/components/schemas/capability.v1.MaterialClassifyResult'
          type: array
      type: object
    capability.v1.CapabilityExtractRequest:
      properties:
        batch_id:
          description: 批次ID(material_ids 为空时必传；material_ids 非空时可选，不传则自动从材料关联)
          type: string
        callback_url:
          description: |-
            结果回调 URL(所有材料处理完成后，系统会向该 URL 发送 POST 请求)
             body 为 JSON：{"material_ids": ["id1", "id2"], "status": 3}，status=3 表示已完成
          type: string
        category_hints:
          description: 手动指定分类(非空时自动跳过分类步骤，每个元素通过 material_id 与 material_ids 中的材料对应)
          items:
            $ref: '#/components/schemas/capability.v1.MaterialCategoryHint'
          type: array
        material_ids:
          description: |-
            材料 ID 列表(与 batch_id 二选一)
             传 material_ids：处理指定材料，所有材料必须属于同一批次
             不传 material_ids：必须传 batch_id，处理该批次下所有材料
          items:
            type: string
          type: array
        with_verification:
          description: |-
            是否对发票类材料执行验真(支持增值税发票、医疗门诊/住院电子发票)
             为 true 时，抽取完成后根据分类结果自动判断是否需要验真
          type: boolean
      type: object
    capability.v1.CapabilityExtractResponse:
      properties:
        materials:
          description: 每个材料的处理状态和结果
          items:
            $ref: '#/components/schemas/capability.v1.CapabilityMaterialResult'
          type: array
      type: object
    capability.v1.CapabilityICDRequest:
      properties:
        disease_str:
          description: 疾病名称或编码(如 "S52.400" 或 "骨折")
          type: string
        page_num:
          description: 页码(从 1 开始，默认 1)
          format: int32
          type: integer
        page_size:
          description: 每页数量(默认 10)
          format: int32
          type: integer
      type: object
    capability.v1.CapabilityICDResponse:
      properties:
        list:
          description: ICD 疾病编码列表
          items:
            $ref: '#/components/schemas/capability.v1.ICDItem'
          type: array
        pagination:
          allOf:
          - $ref: '#/components/schemas/common.Pagination'
          description: 分页信息
      type: object
    capability.v1.CapabilityImageQualityRequest:
      properties:
        batch_id:
          description: 批次 ID(处理批次下所有材料)
          example: 661be601-65c7-4025-af0f-20d357dfb090
          type: string
        blurry_threshold:
          description: 模糊风险判定阈值。开启模糊检测后，若模型输出的模糊风险分数大于该阈值，则判定图像存在模糊风险(0~1，保留2位小数，默认 0.5)
          example: 0.5
          format: float
          type: number
        detection_scope:
          description: 检测范围控制参数。0 表示检测图片中的所有主体，只要任一主体存在质量风险，则整体判定为存在风险；1 表示仅检测第一个主体的质量风险情况。建议采用 0(默认 0)
          example: 0
          format: int32
          type: integer
        file_urls:
          description: URL 上传(与 material_id/batch_id 互斥)
          example:
          - https://example.com/file1.pdf
          items:
            type: string
          type: array
        files:
          description: 文件二进制上传(支持多文件)
          items:
            $ref: '#/components/schemas/common.MultipartUpload'
          type: array
        light_spot_level:
          description: 光斑检测的检测级别控制参数。0 表示优先检测主体边缘与背景区域是否存在光斑；1 表示优先检测主体内容区域是否存在光斑，例如文字、印章、人像等区域是否受光斑影响(默认 0)
          example: 0
          format: int32
          type: integer
        light_spot_threshold:
          description: 光斑风险判定阈值。开启光斑检测后，若模型输出的光斑风险分数大于该阈值，则判定图像存在光斑风险(0~1，保留2位小数，默认 0.5)
          example: 0.5
          format: float
          type: number
        material_id:
          description: 已上传材料的 ID(处理单个材料，与 files/file_urls 互斥)
          example: 8ffe03ce-4714-4b50-8daf-afee06002cc3
          type: string
        photocopy_threshold:
          description: 复印件风险判定阈值。开启复印件检测后，若模型输出的复印件风险分数大于该阈值，则判定图像为复印件风险(0~1，保留2位小数，默认 0.5)
          example: 0.5
          format: float
          type: number
        scan_threshold:
          description: 扫描件风险判定阈值。开启扫描件检测后，若模型输出的扫描件风险分数大于该阈值，则判定图像存在扫描件风险(0~1，保留2位小数，默认 0.5)
          example: 0.5
          format: float
          type: number
        screen_remark_threshold:
          description: 翻拍风险判定阈值。开启翻拍检测后，若模型输出的翻拍风险分数大于该阈值，则判定图像存在翻拍风险(0~1，保留2位小数，默认 0.5)
          example: 0.5
          format: float
          type: number
        un_integrity_level:
          description: 完整性检测的检测级别控制参数。0 表示优先检测主体边缘与背景是否完整；1 表示优先检测主体内容是否完整，例如文字、印章、人像等区域是否缺失(默认 0)
          example: 0
          format: int32
          type: integer
        un_integrity_threshold:
          description: 完整性风险判定阈值。开启完整性检测后，若模型输出的完整性风险分数大于该阈值，则判定图像存在不完整风险。完整性风险检测包括：1.拍摄(因未拍全导致的完整性风险) 2.物理遮挡 3.数字遮挡(如马赛克) 4.物理水印(含水印文件的打印件) 5.数字水印(常规水印，如水印相机) 6.弯折 7.破损(0~1，保留2位小数，默认 0.5)
          example: 0.5
          format: float
          type: number
      type: object
    capability.v1.CapabilityImageQualityResponse:
      properties:
        materials:
          description: 各材料的质检结果
          items:
            $ref: '#/components/schemas/capability.v1.MaterialQualityResult'
          type: array
      type: object
    capability.v1.CapabilityLookupDivisionRequest:
      properties:
        name:
          description: 行政区划名称(支持省/市/县模糊匹配，如 "成都"、"北京"、"南山区")
          type: string
      type: object
    capability.v1.CapabilityLookupDivisionResponse:
      properties:
        divisions:
          description: 匹配的行政区划列表
          items:
            $ref: '#/components/schemas/capability.v1.DivisionItem'
          type: array
      type: object
    capability.v1.CapabilityMaterialInfo:
      properties:
        file_name:
          description: 文件名
          type: string
        file_size:
          description: 文件大小 (bytes)
          type: string
        file_type:
          description: MIME 类型
          example: '"application/pdf"'
          type: string
        material_id:
          description: 材料唯一标识
          example: '"8ffe03ce-4714-4b50-8daf-afee06002cc3"'
          type: string
      type: object
    capability.v1.CapabilityMaterialResult:
      properties:
        category:
          description: 分类结果 - 大类
          type: string
        error:
          description: 错误信息(处理失败时返回)
          type: string
        extract_result:
          allOf:
          - $ref: '#/components/schemas/common.ExtractResult'
          description: 抽取结果(处理完成后返回)
        fiscal_verify_result:
          allOf:
          - $ref: '#/components/schemas/common.FiscalBillVerifyResult'
          description: 财政票据验真结果(with_verification=true 且验真完成后返回，医疗门诊/住院电子票据)
        material_id:
          description: 材料 ID
          type: string
        material_type:
          description: 分类结果 - 小类
          type: string
        status:
          description: '该材料的处理状态(0: 待处理, 1: 分类中, 2: 抽取中, 3: 已完成, 4: 失败)'
          format: enum
          type: integer
        timing:
          allOf:
          - $ref: '#/components/schemas/capability.v1.MaterialTiming'
          description: 各阶段处理耗时(毫秒，处理完成后返回)
        vat_verify_result:
          allOf:
          - $ref: '#/components/schemas/common.VatInvoiceVerifyResult'
          description: 增值税发票验真结果(with_verification=true 且验真完成后返回)
      type: object
    capability.v1.CapabilityMedicalInstitutionRequest:
      properties:
        institution_name:
          description: 医疗机构名称
          type: string
        page_num:
          description: 页码(从 1 开始，默认 1)
          format: int32
          type: integer
        page_size:
          description: 每页数量(默认 10)
          format: int32
          type: integer
      type: object
    capability.v1.CapabilityMedicalInstitutionResponse:
      properties:
        list:
          description: 医疗机构列表
          items:
            $ref: '#/components/schemas/capability.v1.MedicalInstitutionItem'
          type: array
        pagination:
          allOf:
          - $ref: '#/components/schemas/common.Pagination'
          description: 分页信息
      type: object
    capability.v1.CapabilitySocialInsuranceRequest:
      properties:
        insurance_name:
          description: 医保目录项名称(药品名/诊疗项目名/服务设施名)
          type: string
        page_num:
          description: 页码(从 1 开始，默认 1)
          format: int32
          type: integer
        page_size:
          description: 每页数量(默认 10)
          format: int32
          type: integer
        zone_code:
          description: |-
            地区编码(6 位行政区划编码，如 "120100" 天津市、"510100" 成都市)
             可通过 LookupDivision 接口查询获取，返回结果中的 preferred_code 即为本字段的值
          type: string
      type: object
    capability.v1.CapabilitySocialInsuranceResponse:
      properties:
        list:
          description: 医保目录项列表
          items:
            $ref: '#/components/schemas/capability.v1.SocialInsuranceItem'
          type: array
        pagination:
          allOf:
          - $ref: '#/components/schemas/common.Pagination'
          description: 分页信息
      type: object
    capability.v1.CapabilityUploadRequest:
      properties:
        batch_id:
          description: 调用方自定义批次ID(UUID格式，不传则系统生成)
          example: 661be601-65c7-4025-af0f-20d357dfb090
          type: string
        file_urls:
          description: URL 上传(与 files 可混合使用)
          example:
          - https://example.com/file1.pdf
          - https://example.com/file2.jpg
          items:
            type: string
          type: array
        files:
          description: 文件二进制上传(支持多文件)
          items:
            $ref: '#/components/schemas/common.MultipartUpload'
          type: array
      type: object
    capability.v1.CapabilityUploadResponse:
      properties:
        batch_id:
          description: 批次ID
          example: '"661be601-65c7-4025-af0f-20d357dfb090"'
          type: string
        materials:
          description: 上传结果列表
          items:
            $ref: '#/components/schemas/capability.v1.CapabilityMaterialInfo'
          type: array
      type: object
    capability.v1.ClassificationFieldConfig:
      description: 单个分类的字段配置
      properties:
        classification_name:
          description: 分类名称（小类名称，如"医疗门诊收费票据（电子）"）
          example: '"医疗门诊收费票据（电子）"'
          type: string
        fields:
          description: 该分类下的独立字段启用/禁用配置
          items:
            $ref: '#/components/schemas/capability.v1.FieldEnabledConfig'
          type: array
        tables:
          description: 该分类下的表格配置（每个表格含自身开关及其列字段开关）
          items:
            $ref: '#/components/schemas/capability.v1.TableFieldConfig'
          type: array
      type: object
    capability.v1.DivisionItem:
      description: 行政区划信息
      properties:
        city_code:
          description: 所属地级市编码(省级条目为空)
          type: string
        city_name:
          description: 所属地级市名称(省级条目为空)
          type: string
        code:
          description: 该条目自身的 6 位行政区划编码
          type: string
        name:
          description: 该条目自身的名称
          type: string
        preferred_code:
          description: |-
            推荐使用的地区编码(有地级市返回地级市代码，否则返回省级代码)
             此值可直接作为 SearchSocialInsurance 的 zone_code 参数
          type: string
        province_code:
          description: 所属省级编码
          type: string
        province_name:
          description: 所属省级名称
          type: string
      type: object
    capability.v1.FieldEnabledConfig:
      description: 单个字段的启用/禁用配置
      properties:
        enabled:
          description: 是否启用
          example: true
          type: boolean
        field_name:
          description: 字段名称
          example: '"票据代码"'
          type: string
      type: object
    capability.v1.ICDItem:
      description: ICD 疾病编码信息
      properties:
        additional_code:
          description: 附加编码
          type: string
        category_name:
          description: 分类名称(如 "ICD-10疾病编码")
          type: string
        category_uuid:
          description: 分类唯一标识
          type: string
        detail_uuid:
          description: 明细唯一标识
          type: string
        disease_code:
          description: 疾病编码
          type: string
        disease_name:
          description: 疾病名称
          type: string
        id:
          description: 记录 ID
          format: int32
          type: integer
        is_show:
          description: 是否展示
          type: boolean
        memo:
          description: 备注
          type: string
        parent_uuid:
          description: 父级唯一标识
          type: string
      type: object
    capability.v1.MaterialCategoryHint:
      properties:
        category:
          description: 大类名称
          type: string
        material_id:
          description: 材料 ID
          type: string
        material_type:
          description: 小类名称
          type: string
      type: object
    capability.v1.MaterialClassifyResult:
      properties:
        category:
          description: 大类名称
          type: string
        material_id:
          description: 材料 ID
          type: string
        material_type:
          description: 小类名称
          type: string
      type: object
    capability.v1.MaterialQualityResult:
      properties:
        material_id:
          description: 材料 ID
          type: string
        pages:
          description: 各页的质检结果
          items:
            $ref: '#/components/schemas/capability.v1.PageQualityResult'
          type: array
      type: object
    capability.v1.MaterialTiming:
      description: 材料各阶段处理耗时(毫秒)
      properties:
        classify_ms:
          description: 材料分类耗时(毫秒)
          type: string
        extract_ms:
          description: 信息抽取耗时(毫秒)
          type: string
        parse_ms:
          description: 文件解析耗时(毫秒)
          type: string
      type: object
    capability.v1.MedicalInstitutionItem:
      description: 医疗机构信息
      properties:
        address:
          description: 详细地址
          type: string
        contact:
          description: 联系人
          type: string
        contact_phone:
          description: 联系电话
          type: string
        email:
          description: 邮箱
          type: string
        hospital_grade:
          description: 医院级别
          type: string
        hospital_level:
          description: 医院等级
          type: string
        id:
          description: 记录 ID
          type: string
        institution_code:
          description: 机构编码
          type: string
        institution_introduce:
          description: 机构简介
          type: string
        institution_name:
          description: 机构名称
          type: string
        institution_name_alias:
          description: 机构别名
          type: string
        institution_nature:
          description: 机构性质
          type: string
        institution_type:
          description: 机构类型
          type: string
        institution_url:
          description: 机构网址
          type: string
        institution_uuid:
          description: 机构唯一标识
          type: string
        medical_nature:
          description: 医疗性质
          type: string
        zip_code:
          description: 邮编
          type: string
        zone_city:
          description: 城市名称
          type: string
        zone_city_code:
          description: 城市编码
          type: string
        zone_county:
          description: 区县名称
          type: string
        zone_county_code:
          description: 区县编码
          type: string
        zone_province:
          description: 省份名称
          type: string
        zone_province_code:
          description: 省份编码
          type: string
      type: object
    capability.v1.PageQualityResult:
      properties:
        page:
          description: 页码(从 1 开始)
          format: int32
          type: integer
        risk_details:
          allOf:
          - $ref: '#/components/schemas/common.RiskDetails'
          description: 该页的风险详情
        risk_type:
          description: 该页命中的风险类型列表
          enum:
          - blurry
          - un_integrity
          - photocopy
          - screen_remark
          - light_spot
          - scan
          items:
            type: string
          type: array
      type: object
    capability.v1.QueryFieldConfigRequest:
      properties:
        classification_names:
          description: 要查询的分类名称列表，为空时返回所有分类的字段配置
          example:
          - 医疗门诊收费票据（电子）
          - 住院费用明细清单
          items:
            type: string
          type: array
      type: object
    capability.v1.QueryFieldConfigResponse:
      properties:
        classifications:
          description: 各分类的字段配置
          items:
            $ref: '#/components/schemas/capability.v1.ClassificationFieldConfig'
          type: array
      type: object
    capability.v1.SetFieldConfigRequest:
      properties:
        classifications:
          description: |-
            分类字段配置列表（支持同时设置多个分类）
             fields 控制独立字段，tables 控制表格及其列字段
          example:
          - classification_name: 医疗门诊收费票据（电子）
            fields:
            - enabled: false
              field_name: 票据代码
            tables:
            - enabled: true
              fields:
              - enabled: false
                field_name: 项目名称
              table_name: 费用明细
          items:
            $ref: '#/components/schemas/capability.v1.ClassificationFieldConfig'
          type: array
      type: object
    capability.v1.SetFieldConfigResponse:
      type: object
    capability.v1.SocialInsuranceItem:
      description: 医保目录项
      properties:
        detail_uuid:
          description: 明细唯一标识
          type: string
        dose_form:
          description: 剂型
          type: string
        fee_level:
          description: '费用等级(1: 甲类, 2: 乙类)'
          type: string
        fee_level_name:
          description: 费用等级名称
          type: string
        hospital_level:
          description: 医院等级
          type: string
        id:
          description: 记录 ID
          type: string
        labels_memo:
          description: 标签备注
          type: string
        limit_price1:
          description: 限价1
          type: string
        limit_price2:
          description: 限价2
          type: string
        limit_price3:
          description: 限价3
          type: string
        medical_invoice_items_type:
          description: 发票项类型编码
          type: string
        medical_invoice_items_type_name:
          description: 发票项类型名称(如 西药费、中成药费)
          type: string
        memo:
          description: 备注
          type: string
        price:
          description: 价格
          type: string
        restricted:
          description: '是否限制用药(0: 否, 1: 是)'
          format: int32
          type: integer
        self_ratio:
          description: 自费比例
          format: double
          type: number
        self_ratio_type:
          description: 自费比例类型
          type: string
        self_ratio_type_name:
          description: 自费比例类型名称
          type: string
        social_insurance_catalog_code:
          description: 医保目录编码
