            发票验真返回码说明

             001    成功，验证为真
             002    此发票今日查询次数已达上限（5次），请次日查询
             005    请求不合法，请核对验真参数
             006    发票信息不一致，请核对发票信息
             009    查无此票，请核对发票信息
             104    已超过最大查验量
             105    查询发票不规范，请核对发票信息
             106    查验异常，国税局/发票查验地区升级维护，请稍后重试
             107    鉴权失败
             108    参数不为空
             109    参数长度不正确
             110    参数 invoice_code 的格式或取值范围错误
             111    参数 invoice_sum 的格式或取值范围错误
             112    参数 verify_code 的格式或取值范围错误
             113    参数 invoice_no 的格式或取值范围错误
             114    校验码不正确，应为后六位
             115    超过服务有效期限限制
             116    此发票今日查询次数已达上限（5次），请次日查询
             1005   请核对验真参数是否符合发票规范
             1010   日期格式不正确（YYYYMMDD）
             1011   请求参数不完整
             1021   查验异常，国税局/发票查验地区升级维护，请稍后重试
             10014  日期当天不能查验
             10015  开票金额：不合法的格式
             10016  检验码：不能为空
             10017  超过五年的不能查验
             10018  检验码：不合法的长度
             10020  没有查验权限
          type: string
        message:
          description: 发票验真返回码说明
          type: string
      type: object
info:
  title: ClaimAPI API
  version: 0.0.1
openapi: 3.0.3
paths:
  /doc-agent/api/v1/claim/{claimId}:
    delete:
      description: 清理数据： material_ids 为空时，清理所有文件
      operationId: ClaimAPI_DeleteFiles
      parameters:
      - in: path
        name: claimId
        required: true
        schema:
          type: string
      - in: query
        name: materialIds
        schema:
          items:
            type: string
          type: array
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim.v1.DeleteFilesResponse'
          description: OK
      tags:
      - ClaimAPI
  /doc-agent/api/v1/claim/{claimId}/files:
    get:
      description: 获取案件的文件列表
      operationId: ClaimAPI_FetchFiles
      parameters:
      - in: path
        name: claimId
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim.v1.FetchFilesResponse'
          description: OK
      tags:
      - ClaimAPI
  /doc-agent/api/v1/claim/{claimId}/material/{materialId}/re_confidence:
    post:
      description: 重新计算置信度
      operationId: ClaimAPI_ReConfidence
      parameters:
      - in: path
        name: claimId
        required: true
        schema:
          type: string
      - in: path
        name: materialId
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/claim.v1.ReConfidenceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim.v1.ReConfidenceResponse'
          description: OK
      tags:
      - ClaimAPI
  /doc-agent/api/v1/claim/create:
    post:
      description: 创建案件
      operationId: ClaimAPI_APICreateClaim
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                callback_api:
                  description: |-
                    回调接口
                     处理结果会通过回调接口通知
                     注：可能需要开发并联调后才能正常使用回调
                  example: http://example.com/callback
                  type: string
                file_urls:
                  description: 批量文件URL
                  example:
                  - https://example.com/file1.jpg
                  - https://example.com/file2.jpg
                  items:
                    type: string
                  type: array
                files:
                  items:
                    format: binary
                    type: string
                  type: array
                insured_name:
                  description: 被保险人姓名
                  example: 张三
                  type: string
                is_async:
                  description: |-
                    是否异步
                     异步调用时，会返回claim_id和materials列表，然后通过后续其他接口轮询获取结果
                     同步调用时，会在当前接口返回所有的处理结果。
                     注：不建议使用同步调用。因为同步调用处理时间较长，且网络环境波动可能导致长连接断开
                  example: true
                  type: boolean
                policy_no:
                  description: 保单号
                  example: p12345678
                  type: string
                stages:
                  description: "执行阶段 \n 请使用以下五种组合之一：\n [1], [1,2], [1,2,3], [1,2,4],
                    [1,2,3,4]\n 数字表示的含义：1分类，2抽取，3时间线，4真实性校验"
                  example:
                  - 1
                  - 2
                  items:
                    format: int32
                    type: integer
                  type: array
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim.v1.APICreateClaimResponse'
          description: OK
      tags:
      - ClaimAPI
  /doc-agent/api/v1/claims/{claimId}/materials/category-mappings:
    get:
