  /doc-agent/api/v1/file/upload:
    post:
      description: 上传文件并创建案件
      operationId: ClaimAPI_UploadFiles
      parameters:
      - in: header
        name: x-ti-app-id
        required: true
        schema:
          type: string
      - in: header
        name: x-ti-secret-code
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                files:
                  items:
                    format: binary
                    type: string
                  type: array
                insured_name:
                  description: 被保险人姓名
                  type: string
                policy_no:
                  description: 保单号
                  type: string
                target_stage:
                  description: |-
                    目标阶段
                     100 材料核查 300 信息提取 400 条款理算 500 决策
                  format: int32
                  type: integer
                with_consistency_check:
                  description: 是否开启一致性校验
                  type: boolean
                with_normalization_check:
                  description: 是否开启归一化校验
                  type: boolean
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim.v1.UploadFilesResponse'
          description: OK
      tags:
      - ClaimAPI
