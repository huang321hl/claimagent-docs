      properties:
        callback_api:
          description: |-
            回调接口
             处理结果会通过回调接口通知
             注：可能需要开发并联调后才能正常使用回调
          example: http://example.com/callback
          type: string
        file_urls:
          description: 批量文件URL
          example:
          - https://example.com/file1.jpg
          - https://example.com/file2.jpg
          items:
            type: string
          type: array
        files:
          description: 案件材料文件
          items:
            $ref: '#/components/schemas/common.MultipartUpload'
          type: array
        insured_name:
          description: 被保险人姓名
          example: 张三
          type: string
        is_async:
          description: |-
            是否异步
             异步调用时，会返回claim_id和materials列表，然后通过后续其他接口轮询获取结果
             同步调用时，会在当前接口返回所有的处理结果。
             注：不建议使用同步调用。因为同步调用处理时间较长，且网络环境波动可能导致长连接断开
          example: true
          type: boolean
        policy_no:
          description: 保单号
          example: p12345678
          type: string
        stages:
          description: "执行阶段 \n 请使用以下五种组合之一：\n [1], [1,2], [1,2,3], [1,2,4], [1,2,3,4]\n
            数字表示的含义：1分类，2抽取，3时间线，4真实性校验"
          example:
          - 1
          - 2
          items:
            format: int32
            type: integer
          type: array
      type: object
