    common.VerifyVatRet:
      properties:
        code:
          description: |-
            发票验真返回码说明

             001    成功，验证为真
             002    此发票今日查询次数已达上限（5次），请次日查询
             005    请求不合法，请核对验真参数
             006    发票信息不一致，请核对发票信息
             009    查无此票，请核对发票信息
             104    已超过最大查验量
             105    查询发票不规范，请核对发票信息
             106    查验异常，国税局/发票查验地区升级维护，请稍后重试
             107    鉴权失败
             108    参数不为空
             109    参数长度不正确
             110    参数 invoice_code 的格式或取值范围错误
             111    参数 invoice_sum 的格式或取值范围错误
             112    参数 verify_code 的格式或取值范围错误
             113    参数 invoice_no 的格式或取值范围错误
             114    校验码不正确，应为后六位
             115    超过服务有效期限限制
             116    此发票今日查询次数已达上限（5次），请次日查询
             1005   请核对验真参数是否符合发票规范
             1010   日期格式不正确（YYYYMMDD）
             1011   请求参数不完整
             1021   查验异常，国税局/发票查验地区升级维护，请稍后重试
             10014  日期当天不能查验
             10015  开票金额：不合法的格式
             10016  检验码：不能为空
             10017  超过五年的不能查验
             10018  检验码：不合法的长度
             10020  没有查验权限
          type: string
        message:
          description: 发票验真返回码说明
          type: string
      type: object
