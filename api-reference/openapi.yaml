info:
  title: ""
  version: 0.0.1
openapi: 3.0.3
paths:
  /doc-agent/api/v1/claim/{claimId}:
    delete:
      description: 清理数据： material_ids 为空时，清理所有文件
      operationId: ClaimAPI_DeleteFiles
      parameters:
      - in: path
        name: claimId
        required: true
        schema:
          type: string
      - in: query
        name: materialIds
        schema:
          items:
            type: string
          type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim.v1.DeleteFilesResponse'
          description: OK
      tags:
      - ClaimAPI
  /doc-agent/api/v1/claim/{claimId}/files:
    get:
      description: 获取案件的文件列表
      operationId: ClaimAPI_FetchFiles
      parameters:
      - in: path
        name: claimId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/claim.v1.FetchFilesResponse'
          description: OK
      tags:
      - ClaimAPI
  /doc-agent/api/v1/claim/{claimId}/material/{materialId}/re_confidence:
    post:
      description: 重新计算置信度
      operationId: ClaimAPI_ReConfidence
      parameters:
      - in: path
        name: claimId
        required: true
        schema:
          type: string
      - in: path
        name: materialId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
